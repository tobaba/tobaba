<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="Tobaba — Windows 桌面工具">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101017"/>
      <stop offset="0.55" stop-color="#191327"/>
      <stop offset="1" stop-color="#0d0d13"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f2ff"/>
      <stop offset="0.7" stop-color="#ded1ff"/>
      <stop offset="1" stop-color="#cca85b"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbb8f8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8f79c9" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b49cf0" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#b49cf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="1" y="1" width="958" height="238" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="960" height="240" fill="url(#bg)"/>

    <circle cx="820" cy="40" r="200" fill="url(#glow)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="220" r="170" fill="url(#glow)" opacity="0.5"/>

    <rect x="-320" y="-80" width="220" height="400" fill="url(#sweep)" transform="rotate(12 480 120)">
      <animate attributeName="x" values="-320;1100" dur="9s" repeatCount="indefinite"/>
    </rect>

    <text x="56" y="92" font-family="Segoe UI, Helvetica Neue, Microsoft YaHei, sans-serif" font-size="52" font-weight="700" fill="url(#name)">Tobaba</text>
    <text x="57" y="128" font-family="Segoe UI, Helvetica Neue, Microsoft YaHei, sans-serif" font-size="19" fill="#b7afce">把日历钉在任务栏上 · 一个人维护的 Windows 桌面工具</text>
    <g font-family="Segoe UI, Helvetica Neue, Microsoft YaHei, sans-serif" font-size="13" fill="#cfc6e8">
      <rect x="56" y="158" width="98" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="105" y="178" text-anchor="middle">Tauri 2 · Rust</text>
      <rect x="164" y="158" width="110" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="219" y="178" text-anchor="middle">React · TS</text>
      <rect x="284" y="158" width="126" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="347" y="178" text-anchor="middle">Windows 10 / 11</text>
    </g>

    <g transform="translate(700 46)">
      <rect width="200" height="148" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="16" y="16" width="168" height="84" rx="14" fill="url(#tile)" fill-opacity="0.22" stroke="#d8c8ff" stroke-opacity="0.35"/>
      <text x="30" y="76" font-family="Segoe UI, Helvetica Neue, Microsoft YaHei, sans-serif" font-size="46" font-weight="700" fill="#f4efff">24</text>
      <text x="96" y="54" font-family="Segoe UI, Helvetica Neue, Microsoft YaHei, sans-serif" font-size="13" fill="#e7dcff">星期六</text>
      <text x="96" y="76" font-family="Segoe UI, Helvetica Neue, Microsoft YaHei, sans-serif" font-size="13" fill="#cfc0ef" fill-opacity="0.8">九月十五</text>
      <text x="30" y="126" font-family="Segoe UI, Helvetica Neue, Microsoft YaHei, sans-serif" font-size="12" fill="#b7a9d8">6 日程 · 4 待办</text>
      <text x="100" y="176" font-family="Segoe UI, Helvetica Neue, Microsoft YaHei, sans-serif" font-size="12" fill="#9d93bd" text-anchor="middle">UCalendar · v2.1.1</text>`n      <circle cx="176" cy="30" r="3" fill="#cca85b">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <rect x="1" y="1" width="958" height="238" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>


