<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Tobaba — local-first desktop tools for Windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#07060c"/>
      <stop offset="1" stop-color="#0c0918"/>
    </linearGradient>
    <radialGradient id="violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b6cff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8b6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4de1ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4de1ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e4dbff"/>
      <stop offset="1" stop-color="#9d81ff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4de1ff"/>
      <stop offset="0.5" stop-color="#8b6cff"/>
      <stop offset="1" stop-color="#8b6cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b6cff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b79bff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b6cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#8b6cff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8b6cff" fill-opacity="0.10"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>
  <rect x="620" y="0" width="580" height="380" fill="url(#dots)"/>

  <ellipse cx="1010" cy="80" rx="380" ry="240" fill="url(#violet)"/>
  <ellipse cx="120" cy="360" rx="330" ry="200" fill="url(#cyan)"/>

  <g fill="none" stroke="#4de1ff" stroke-opacity="0.30" stroke-width="1.2">
    <path d="M0 40 H210"/>
    <path d="M0 358 H150 l22 -22 H470"/>
    <path d="M620 60 H700 l24 -22 H960"/>
  </g>
  <g fill="none" stroke="#8b6cff" stroke-width="1.6" stroke-linecap="round">
    <path id="flow1" d="M0 40 H210" stroke-dasharray="34 260" stroke-opacity="0.9">
      <animate attributeName="stroke-dashoffset" values="300;0" dur="5.5s" repeatCount="indefinite"/>
    </path>
    <path id="flow2" d="M620 60 H700 l24 -22 H960" stroke-dasharray="26 520" stroke-opacity="0.8">
      <animate attributeName="stroke-dashoffset" values="560;0" dur="5.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#b79bff">
    <circle cx="210" cy="40" r="3"/>
    <circle cx="470" cy="336" r="3"/>
    <circle cx="724" cy="38" r="3"/>
    
  </g>

  <text x="72" y="96" font-family="Consolas, ui-monospace, monospace" font-size="12" letter-spacing="5" fill="#6f6690">/// LOCAL-FIRST DESKTOP SOFTWARE</text>

  <text x="68" y="196" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="92" font-weight="800" letter-spacing="1" fill="url(#name)">TOBABA</text>

  <rect x="72" y="218" width="300" height="3" rx="1.5" fill="url(#rule)">
    <animate attributeName="width" values="300;420;300" dur="8s" repeatCount="indefinite"/>
  </rect>

  <text x="72" y="258" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#b6add2">Windows 桌面工具 · 一个人做 · 数据全在本机</text>

  <g font-family="Consolas, ui-monospace, monospace" font-size="12.5" fill="#8f86ab">
    <rect x="72" y="284" width="152" height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#2c2344"/>
    <text x="148" y="304" text-anchor="middle" fill="#cfc4ee">Tauri + Rust</text>
    <rect x="236" y="284" width="152" height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#2c2344"/>
    <text x="312" y="304" text-anchor="middle" fill="#cfc4ee">React + TS</text>
    <rect x="400" y="284" width="132" height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#2c2344"/>
    <text x="466" y="304" text-anchor="middle" fill="#cfc4ee">8 MB exe</text>
  </g>

  <g>
    <rect x="736" y="56" width="400" height="258" rx="14" fill="#0b0914" stroke="#2c2344" stroke-width="1.2"/>
    <path d="M736 70 a14 14 0 0 1 14 -14 h372 a14 14 0 0 1 14 14 v12 h-400 Z" fill="#120e22"/>
    <circle cx="760" cy="72" r="4" fill="#ff5f57"/>
    <circle cx="776" cy="72" r="4" fill="#febc2e"/>
    <circle cx="792" cy="72" r="4" fill="#28c840"/>
    <text x="936" y="76" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#6f6690">powershell — UCalendar</text>

    <g font-family="Consolas, ui-monospace, monospace" font-size="12.5">
      <text x="758" y="118" fill="#6f6690">PS D:\dev&gt;</text>
      <text x="838" y="118" fill="#e6dfff">.\build.ps1</text>

      <text x="758" y="148" fill="#4de1ff" fill-opacity="0.75">  Compiling</text>
      <text x="838" y="148" fill="#b6add2">ucalendar v2.1.1</text>

      <text x="758" y="176" fill="#4de1ff" fill-opacity="0.75">   Finished</text>
      <text x="838" y="176" fill="#b6add2">release [8.0 MB]</text>

      <text x="758" y="206" fill="#6f6690">PS D:\dev&gt;</text>
      <text x="838" y="206" fill="#e6dfff">.\UCalendar.exe</text>

      <text x="758" y="236" fill="#7ee0b0">✓ tray + clock ready</text>

      <text x="758" y="276" fill="#8b6cff">&gt;</text>
      <rect x="774" y="265" width="8" height="14" fill="#b79bff">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g>
    <rect x="150" y="120" width="130" height="64" fill="url(#sweep)" opacity="0.09" transform="skewX(-18)">
      <animateTransform attributeName="transform" type="translate" values="-260 0;1160 0" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0" y="377" width="1200" height="2" fill="url(#hair)"/>
</svg>
